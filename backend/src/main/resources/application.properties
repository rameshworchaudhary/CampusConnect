server.port=${PORT:8080}
server.address=0.0.0.0

# Import local overrides and backend/.env if present.
# Both paths support starting Maven from the project root or backend directory.
# The [.properties] hint lets Spring Boot parse dotenv KEY=VALUE entries.
spring.config.import=optional:file:./application-local.properties,optional:file:./.env[.properties],optional:file:./backend/.env[.properties],optional:file:./backend/application-local.properties

# Application
spring.application.name=campusconnect-backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusconnect}?createDatabaseIfNotExist=true&sslMode=VERIFY_IDENTITY&allowPublicKeyRetrieval=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ishwor143@#$}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Application URLs
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# SMTP Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:${SMTP_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${SMTP_FROM:}}

# Super Admin Initial Bootstrap
app.admin.bootstrap.email=${ADMIN_EMAIL:admin@univ.edu}
app.admin.bootstrap.password=${ADMIN_PASSWORD}
app.admin.bootstrap.name=${ADMIN_NAME:SuperAdmin}
app.seed-demo-data=${SEED_DEMO_DATA:false}

# Logging
logging.level.com.campusconnect=INFO
logging.level.org.springframework.security=WARN

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
